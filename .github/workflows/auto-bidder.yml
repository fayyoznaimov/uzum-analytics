# Авто-ставка «Буст в ТОП» — ручной запуск из GitHub (Actions → «Авто-ставка» → Run workflow).
# Выполняется на сервере ParisaUbuntu в рабочей копии ~/uzum с её .env: БД и токен кабинета есть только там.
# Без галочки «apply» — только предложения; с ней — ставки меняются, но только если в .env включён AUTO_BIDDER_APPLY=true.
name: Авто-ставка

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Реально изменить ставки в кабинете (нужен AUTO_BIDDER_APPLY=true в .env)'
        type: boolean
        default: false
      telegram:
        description: 'Отправить отчёт в Telegram'
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  auto-bidder:
    runs-on: [self-hosted, uzum-server]
    timeout-minutes: 20
    steps:
      - name: Авто-ставка
        env:
          APPLY: ${{ inputs.apply }}
          TELEGRAM: ${{ inputs.telegram }}
        run: |
          set -euo pipefail
          args=()
          [ "$APPLY" = "true" ] && args+=(--apply)
          [ "$TELEGRAM" = "true" ] && args+=(--telegram)
          cd ~/uzum
          set -a && . ./.env && set +a
          npx tsx apps/api/scripts/auto-bidder.ts "${args[@]}"
